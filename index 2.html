<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masotsha High School – Teacher Hub</title><meta name="theme-color" content="#1b2f5e">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#17223b;--mut:#5d6a85;--pri:#1b2f5e;--pri2:#2c4a8f;--acc:#c8902e;--ok:#1f7a4d;--bad:#b3261e;--line:#dde1ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1524;--card:#18203a;--ink:#e8ecf6;--mut:#9aa6c4;--pri:#7fa2f0;--pri2:#a9c0f7;--acc:#e0aa4a;--ok:#4cc38a;--bad:#ff8a80;--line:#2b3556}}
:root[data-theme=dark]{--bg:#0f1524;--card:#18203a;--ink:#e8ecf6;--mut:#9aa6c4;--pri:#7fa2f0;--pri2:#a9c0f7;--acc:#e0aa4a;--ok:#4cc38a;--bad:#ff8a80;--line:#2b3556}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,'Times New Roman',serif;margin:.2em 0 .5em;line-height:1.2}
.shell{display:flex;min-height:100vh}
nav{width:230px;background:var(--pri);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh;flex:none}
nav b{display:block;font:700 18px Georgia,serif;padding:4px 10px 14px}
nav a{display:block;color:#e9eefc;padding:11px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px}
nav a.on,nav a:hover{background:rgba(255,255,255,.16)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) nav{background:#121a30}}
main{flex:1;padding:22px;max-width:1000px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
textarea{min-height:110px}
input[type=checkbox],input[type=radio]{width:auto}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;margin:4px 4px 4px 0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{color:#0f1524}}
.btn.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.bad{background:var(--bad);color:#fff}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-size:13px;margin:2px}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;background:#fff4dc;color:#5a4000}.err{background:#fde7e5;color:#7a1510}.okm{background:#e2f5ea;color:#0f5132}
.sub{color:var(--mut);font-size:14px}
.auth{max-width:520px;margin:0 auto;padding:22px}.crest{text-align:center;padding:18px 0}.crest h1{color:var(--pri);margin:0}.crest span{color:var(--acc);font-weight:700}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}.chk label{font-weight:400;margin:2px 0;display:flex;gap:6px;align-items:center}
.chat{max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;background:var(--bg)}
.me{text-align:right;color:var(--pri)}.bot{white-space:pre-wrap;margin:6px 0}
.top{display:none}
@media(max-width:800px){.shell{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:5;overflow-x:auto}nav b{display:none}nav a{flex:1;text-align:center;font-size:12px;padding:8px 6px;margin:0;white-space:nowrap}main{padding:14px 12px 90px}.top{display:block}}
@media print{nav,.noprint,.top{display:none!important}main{padding:0}.card{border:0}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div>
<script>
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10),today=()=>new Date().toISOString().slice(0,10);
const term=()=>{const m=new Date().getMonth();return m<4?'Term 1':m<8?'Term 2':'Term 3'};
async function hash(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mhs:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return 'x'+btoa(s)}}
const SD={'English Language':'Languages','English Literature':'Languages','Ndebele':'Languages','Shona':'Languages','Mathematics':'Mathematics','Combined Science':'Sciences','Biology':'Sciences','Chemistry':'Sciences','Physics':'Sciences','Computer Science':'Sciences','Information and Communication Technology':'Sciences','Business Studies':'Commercial Subjects','Accounting':'Commercial Subjects','Economics':'Commercial Subjects','Management of Business':'Commercial Subjects','Geography':'Humanities','History':'Humanities','Sociology':'Humanities','Family and Religious Studies':'Humanities','Agriculture':'Practical and Technical Subjects','Food Technology and Design':'Practical and Technical Subjects','Fashion and Fabrics':'Practical and Technical Subjects','Textile Design and Technology':'Practical and Technical Subjects','Building Technology and Design':'Practical and Technical Subjects','Metal Technology and Design':'Practical and Technical Subjects','Wood Technology and Design':'Practical and Technical Subjects','Art and Design':'Practical and Technical Subjects','Music':'Practical and Technical Subjects','Physical Education':'Practical and Technical Subjects'};
function seed(){return{users:[],cfg:{school:'Masotsha High School',depts:['Languages','Mathematics','Sciences','Commercial Subjects','Humanities','Practical and Technical Subjects'],
subjects:{O:['Mathematics','English Language','English Literature','Ndebele','Shona','Combined Science','Biology','Chemistry','Physics','Geography','History','Business Studies','Accounting','Agriculture','Computer Science','Information and Communication Technology','Food Technology and Design','Fashion and Fabrics','Textile Design and Technology','Building Technology and Design','Metal Technology and Design','Wood Technology and Design','Art and Design','Music','Physical Education'],
A:['Mathematics','English Literature','History','Geography','Biology','Chemistry','Physics','Computer Science','Accounting','Business Studies','Economics','Management of Business','Agriculture','Sociology','Family and Religious Studies','Food Technology and Design','Fashion and Fabrics','Art and Design']},
classes:{O:['Form 1','Form 2','Form 3','Form 4'],A:['Lower Six','Upper Six']},sdept:SD},students:{},tt:[],regs:[],schemes:[],tests:[],audit:[],reports:[]}}
let db;try{db=JSON.parse(localStorage.getItem('mhs'))}catch(e){}db=db||seed();if(!db.cfg.sdept){db.cfg.sdept=SD;db.cfg.subjects.O=db.cfg.subjects.O.filter(s=>s!='Commerce');db.cfg.classes.O=['Form 1','Form 2','Form 3','Form 4']}
db.assess=db.assess||[];db.syl=db.syl||[];const save=()=>{try{localStorage.setItem('mhs',JSON.stringify(db))}catch(e){}};
async function ensureAdmin(){}
let me=null,view='dash',notice='',chat=[];
const log=(a,r)=>{db.audit.push({t:new Date().toISOString(),u:me?.username||'-',a,r});save()};
const mySubs=()=>me.subs||[];const myClasses=()=>[...new Set(mySubs().flatMap(s=>s.classes.map(c=>c)))];
const flash=(m,t='')=>`<div class="msg ${t}">${esc(m)}</div>`;
const dlg=(msg,t,def)=>new Promise(res=>{const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px';o.innerHTML=`<div class="card" style="max-width:420px;width:100%;margin:0;max-height:85vh;overflow:auto"><div style="white-space:pre-wrap">${esc(msg)}</div>${t=='p'?'<input id="dlgi" style="margin-top:10px">':''}<div style="margin-top:12px"><button class="btn" id="dok">OK</button>${t=='a'?'':'<button class="btn alt" id="dno">Cancel</button>'}</div></div>`;document.body.appendChild(o);const i=o.querySelector('#dlgi');if(i)i.focus();const end=v=>{o.remove();res(v)};o.querySelector('#dok').onclick=()=>end(t=='p'?i.value:true);const n=o.querySelector('#dno');if(n)n.onclick=()=>end(t=='p'?null:false)});
window.alert=m=>{dlg(m,'a')};
function go(v){view=v;notice='';draw()}
const SS={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
function logout(){me=null;SS.del('mhs_u');view='login';draw()}
function draw(){
 if(!me){return $('#app').innerHTML=(view=='register'?regView():loginView())}
 const nav=[['dash','Dashboard'],['tests','In-Class Tests'],['schemes','Schemes of Work'],['regs','Class Registers'],['tt','My Timetable'],['marks','Marks & Projects'],['syl','Syllabus'],['ai','AI Assistant']];
 if(me.role=='admin')nav.push(['admin','Administration']);
 const f={dash,tests,schemes,regs,tt,marks,syl,ai,admin}[view]||dash;
 $('#app').innerHTML=`<div class="shell"><nav><b>Masotsha High School</b>${nav.map(n=>`<a class="${view==n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<a onclick="logout()">Log out</a></nav><main><div class="top sub">Masotsha High School</div>${notice}${f()}</main></div>`;
 if(view=='ai'){const c=$('#chat');if(c)c.scrollTop=1e6}
}
/* AUTH */
function setupView(){return`<div class="auth"><div class="crest"><h1>Masotsha High School</h1><span>First-time setup</span></div><div class="card"><h2>Create the administrator account</h2>${notice}<p class="sub">This account approves teachers and manages subjects, classes and syllabus topics. Write the password down. If it is lost, the records on this device cannot be recovered.</p><label>Full name</label><input id="sn"><label>Username</label><input id="su"><label>Password (8+ characters)</label><input id="sp" type="password"><label>Confirm password</label><input id="sp2" type="password"><button class="btn" onclick="setupAdmin()">Create account</button></div></div>`}
async function setupAdmin(){const v=i=>$('#'+i).value.trim();if(!v('sn')||v('su').length<3||$('#sp').value.length<8||$('#sp').value!=$('#sp2').value){notice=flash('Enter your name, a username of 3+ characters, and matching passwords of 8+ characters.','err');return draw()}
 db.users.push({id:uid(),name:v('sn'),email:v('su')+'@masotsha.local',username:v('su'),pw:await hash($('#sp').value),role:'admin',status:'approved',subs:[]});save();notice=flash('Administrator created. Log in below.','okm');draw()}

async function doLogin(){const n=$('#lu').value.trim().toLowerCase(),p=await hash($('#lp').value);
 const u=db.users.find(u=>u.email.toLowerCase()==n||u.username.toLowerCase()==n);
 if(!u||u.pw!=p){notice=flash('Wrong username or password. Check both and try again.','err');return draw()}
 if(u.status!='approved'){notice=flash(u.status=='pending'?'Your account is waiting for approval by the school administrator.':'This account is not active. Contact the administrator.','err');return draw()}
 me=u;SS.set('mhs_u',u.id);view='dash';try{log('login','user')}catch(e){}try{draw()}catch(e){notice=flash('Could not open the dashboard: '+e.message,'err');me=null;view='login';draw()}}
async function forgot(){const n=await dlg('Enter your username or email:','p');if(!n)return;const u=db.users.find(u=>u.email==n||u.username==n);
 if(!u){alert('No account found.');return}
 const np=await dlg('Reset password for '+u.username+'. Enter a new password (min 8 characters).\nOn the live system a reset link is emailed; in this demo the administrator must approve resets.','p');
 if(np&&np.length>=8){u.resetPw=await hash(np);save();notice=flash('Reset requested. The administrator must approve it before it works.','okm');draw()}}

<div class="grid"><div><label>Full name</label><input id="rn"></div><div><label>Email</label><input id="re" type="email"></div><div><label>Phone</label><input id="rph"></div><div><label>Teacher ID (if any)</label><input id="rt"></div><div><label>Username</label><input id="ru"></div><div><label>School</label><input value="${esc(c.school)}" disabled></div><div><label>Password (8+ characters)</label><input id="rp" type="password"></div><div><label>Confirm password</label><input id="rp2" type="password"></div><div><label>Your position</label><select id="rpost"><option>Teacher</option><option>Head of Department (HOD)</option><option>Deputy Head</option><option>School Head</option></select></div><div><label>Department</label><select id="rd" onchange="regSubs()">${c.depts.map(d=>`<option>${esc(d)}</option>`).join('')}<option value="">None (school management)</option></select></div><div><label>Academic year</label><input id="ry" value="${new Date().getFullYear()}"></div></div>
<label>Level you teach</label><div class="chk"><label><input type="radio" name="lv" value="O" onchange="regSubs()"> O-Level</label><label><input type="radio" name="lv" value="A" onchange="regSubs()"> A-Level</label><label><input type="radio" name="lv" value="B" onchange="regSubs()"> Both</label><label><input type="radio" name="lv" value="N" onchange="regSubs()"> I do not teach a class</label></div>
<div id="subs"></div><button class="btn" onclick="doReg()">Review and submit</button><button class="btn alt" onclick="view='login';notice='';draw()">Back to login</button></div></div>`}
const lvOk=L=>{const r=document.querySelector('input[name=lv]:checked');return r&&(r.value=='B'||r.value==L)};const subOk=s=>{const d=$('#rd').value;return !d||(db.cfg.sdept||{})[s]==d};function regSubs(){const c=db.cfg;let h='';for(const L of['O','A'])if(lvOk(L))h+=`<h3>${L}-Level subjects and classes</h3>`+c.subjects[L].filter(s=>subOk(s)).map((s,i)=>`<div class="card" style="padding:8px 12px;margin-bottom:6px"><label style="margin:0"><input type="checkbox" class="sb" data-l="${L}" data-s="${esc(s)}"> ${esc(s)}</label><div class="chk">${c.classes[L].map(k=>`<label><input type="checkbox" class="cl" data-l="${L}" data-s="${esc(s)}" value="${esc(k)}"> ${esc(k)}</label>`).join('')}</div></div>`).join('');$('#subs').innerHTML=h}
async function doReg(){const v=i=>$('#'+i).value.trim(),e=[];
 if(!v('rn'))e.push('Enter your full name.');if(!/^\S+@\S+\.\S+$/.test(v('re')))e.push('Enter a valid email.');if(v('ru').length<3)e.push('Username needs 3+ characters.');
 if(db.users.some(u=>u.username.toLowerCase()==v('ru').toLowerCase()||u.email.toLowerCase()==v('re').toLowerCase()))e.push('That username or email is already registered.');
 if(v('rp').length<8)e.push('Password needs 8+ characters.');if(v('rp')!=v('rp2'))e.push('Passwords do not match.');
 const subs=[...document.querySelectorAll('.sb:checked')].map(b=>({lvl:b.dataset.l,subj:b.dataset.s,classes:[...document.querySelectorAll('.cl:checked')].filter(c=>c.dataset.l==b.dataset.l&&c.dataset.s==b.dataset.s).map(c=>c.value)}));
 if(subs.some(s=>!s.classes.length))e.push('Select classes for every chosen subject.');
 if(e.length){notice=flash(e.join(' '),'err');draw();return window.scrollTo(0,0)}
 const sum=subs.map(s=>`${s.lvl}-Level ${s.subj}: ${s.classes.join(', ')}`).join('\n');
 if(!await dlg('Please check your details:\n\n'+v('rn')+'\n'+v('rd')+'\n'+sum+'\n\nSubmit registration?','c'))return;
 db.users.push({id:uid(),name:v('rn'),email:v('re'),phone:v('rph'),tid:v('rt'),username:v('ru'),pw:await hash(v('rp')),dept:v('rd'),post:$('#rpost').value,year:v('ry'),subs,role:'teacher',status:'pending'});save();
 view='login';notice=flash('Registration sent. You can log in once the administrator approves your account.','okm');draw()}
/* DASHBOARD */
const dayName=()=>['Sunday',...DAYS,'Saturday'][new Date().getDay()];
const myTT=()=>db.tt.filter(l=>l.uid==me.id).sort((a,b)=>a.start.localeCompare(b.start));
const myRegs=()=>db.regs.filter(r=>r.uid==me.id);
function pendingRegs(){const d=dayName();return myTT().filter(l=>l.day==d&&!myRegs().some(r=>r.date==today()&&r.cls==l.cls&&(r.subj||'')==l.subj&&r.done))}
function dash(){const lv=[...new Set(mySubs().map(s=>s.lvl+'-Level'))].join(' & ')||'—',tl=myTT().filter(l=>l.day==dayName()),p=pendingRegs();
 const sc=db.schemes.filter(s=>s.uid==me.id&&s.rows.some(r=>r.status!='Completed')).length;
 return`<h2>Welcome, ${esc(me.name)}</h2><p class="sub">${new Date().toDateString()} · ${term()} ${new Date().getFullYear()}</p>
<div class="card"><b>${esc(me.post||(me.role=='admin'?'Administrator':'Teacher'))}</b> · ${esc(me.dept||'School management')} · ${lv}<br>${mySubs().map(s=>`<span class="tag">${s.lvl}-Level ${esc(s.subj)}: ${esc(s.classes.join(', '))}</span>`).join('')}</div>
<div class="grid"><div class="card"><h3>Today's timetable</h3>${tl.length?tl.map(l=>`<div>${l.start}–${l.end} · ${esc(l.subj)} · ${esc(l.cls)} · ${esc(l.room||'')}</div>`).join(''):'<p class="sub">No lessons today. Add lessons in My Timetable.</p>'}</div>
<div class="card"><h3>Registers to complete</h3>${p.length?p.map(l=>`<div>${esc(l.cls)} ${esc(l.subj)} <a href="#" onclick="openReg('${esc(l.cls)}','${esc(l.subj)}');return false">Open</a></div>`).join(''):'<p class="sub">Nothing outstanding today.</p>'}</div>
<div class="card"><h3>Schemes needing attention</h3><p>${sc} scheme(s) with unfinished weeks.</p></div>
<div class="card"><h3>Recent tests</h3>${db.tests.filter(t=>t.uid==me.id).slice(-3).map(t=>`<div>${esc(t.topic)} · ${esc(t.cls)} · ${t.status}</div>`).join('')||'<p class="sub">No tests yet.</p>'}</div></div>`}
/* TESTS */
function tests(){const subs=mySubs();return`<h2>In-Class Tests</h2><div class="card noprint"><div class="grid">
<div><label>Subject and class</label><select id="ts">${subs.flatMap(s=>s.classes.map(c=>`<option value="${esc(s.lvl+'|'+s.subj+'|'+c)}">${s.lvl}-Level ${esc(s.subj)} – ${esc(c)}</option>`)).join('')}</select></div>
<div><label>Topic</label><input id="tp"></div><div><label>Subtopic</label><input id="tsub"></div>
<div><label>Total marks</label><input id="tm" type="number" value="30"></div><div><label>Duration (minutes)</label><input id="td" value="40"></div><div><label>Difficulty</label><select id="tdf"><option>Easy</option><option selected>Medium</option><option>Hard</option></select></div></div>
<label>What exactly did you teach? (one point per line)</label><textarea id="tn" placeholder="e.g.&#10;Definition of a quadratic equation&#10;Solving by factorising&#10;Using the quadratic formula"></textarea>
<label>Learning objectives</label><input id="to"><label>Topics to exclude</label><input id="tx">
<label><input type="checkbox" id="tmem" checked> Include marking guide</label>
<button class="btn" onclick="genTest()">Create draft</button>
<p class="sub">Questions are built from your own notes. Upload and syllabus retrieval need the server version; add syllabus points to your notes for now.</p></div><div id="tout">${(db.tests.filter(t=>t.uid==me.id).slice(-1).map(testCard)[0])||''}</div>
${marksCard()}<div class="card noprint"><h3>Saved tests</h3>${db.tests.filter(t=>t.uid==me.id).map(t=>`<div>${esc(t.topic)} · ${esc(t.cls)} · ${t.total} marks · ${t.status} <a href="#" onclick="showTest('${t.id}');return false">Open</a></div>`).join('')||'<p class="sub">None yet.</p>'}</div>`}
function genTest(){const [lvl,subj,cls]=$('#ts').value.split('|'),topic=$('#tp').value.trim(),tot=+$('#tm').value,ex=$('#tx').value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);
 const pts=$('#tn').value.split('\n').map(x=>x.trim()).filter(x=>x&&!ex.some(e=>x.toLowerCase().includes(e)));
 if(!topic||!pts.length||!(tot>0))return alert('Enter a topic, your lesson points and total marks.');
 const base=Math.floor(tot/pts.length);let extra=tot-base*pts.length;
 const verbs=['Define and explain','Describe','Explain, with an example,','Outline the main steps of','Discuss','Show your understanding of'];
 const qs=pts.map((p,i)=>{const m=base+(i<extra?1:0);return{q:`${verbs[i%verbs.length]}: ${p}.`,m,a:`Marks for accurate points on: ${p}. (${m} marks – award marks per correct point from class notes.)`}});
 const t={id:uid(),uid:me.id,lvl,subj,cls,topic,sub:$('#tsub').value,dur:$('#td').value,diff:$('#tdf').value,obj:$('#to').value,total:tot,qs,memo:$('#tmem').checked,status:'Draft – needs your review'};
 db.tests.push(t);log('create test',t.id);save();$('#tout').innerHTML=testCard(t)}
const testCard=t=>`<div class="card" id="tc"><h3>${esc(t.subj)} (${t.lvl}-Level) – ${esc(t.cls)}</h3><p>Topic: ${esc(t.topic)} ${t.sub?'· '+esc(t.sub):''} · Time: ${esc(t.dur)} min · Total: ${t.qs.reduce((a,q)=>a+(+q.m||0),0)} marks · Difficulty: ${t.diff}</p>
<div class="msg noprint">${t.status}. Edit any question or mark below, then approve.</div>
${t.qs.map((q,i)=>`<div style="margin:10px 0"><b>${i+1}.</b> <textarea style="min-height:60px" onchange="editQ('${t.id}',${i},'q',this.value)">${esc(q.q)}</textarea>Marks: <input style="width:70px" type="number" value="${q.m}" onchange="editQ('${t.id}',${i},'m',this.value)"></div>`).join('')}
${t.memo?`<h3>Marking guide</h3>${t.qs.map((q,i)=>`<p>${i+1}. ${esc(q.a)}</p>`).join('')}`:''}
<div class="noprint"><button class="btn" onclick="approveT('${t.id}')">Approve test</button><button class="btn alt" onclick="window.print()">Print</button><button class="btn alt" onclick="dlT('${t.id}')">Download</button></div></div>`;
function editQ(id,i,k,v){const t=db.tests.find(t=>t.id==id);t.qs[i][k]=k=='m'?+v:v;t.total=t.qs.reduce((a,q)=>a+(+q.m||0),0);save()}
function approveT(id){const t=db.tests.find(t=>t.id==id);t.status='Approved by teacher';log('approve test',id);save();showTest(id)}
function showTest(id){$('#tout').innerHTML=testCard(db.tests.find(t=>t.id==id));window.scrollTo(0,0)}
function dlT(id){const t=db.tests.find(t=>t.id==id);const x=`MASOTSHA HIGH SCHOOL\n${t.subj} (${t.lvl}-Level) ${t.cls}\nTopic: ${t.topic}\nTime: ${t.dur} min  Total: ${t.total}\n\n`+t.qs.map((q,i)=>`${i+1}. ${q.q} [${q.m}]`).join('\n\n')+(t.memo?'\n\nMARKING GUIDE\n'+t.qs.map((q,i)=>`${i+1}. ${q.a}`).join('\n'):'');dl(x,'test-'+t.topic+'.txt')}
function dl(x,n){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([x],{type:'text/plain'}));a.download=n;a.click()}
/* MARKS FROM PHOTOS */
let mkT=null,mkRows=null,mkImgs=[],mkMsg='';
function marksCard(){const ts=db.tests.filter(t=>t.uid==me.id);if(!ts.find(t=>t.id==mkT))mkT=ts.length?ts[ts.length-1].id:null;
 return`<div class="card noprint"><h3>Enter test marks</h3>`+(ts.length?`<label>Test</label><select id="mkt" onchange="mkT=this.value;mkRows=null;mkImgs=[];mkMsg='';mkDraw()">${ts.map(t=>`<option value="${t.id}" ${t.id==mkT?'selected':''}>${esc(t.topic)} – ${esc(t.cls)} (${t.total} marks)</option>`).join('')}</select><div id="mkbody">${mkBody()}</div>`:'<p class="sub">Create a test first.</p>')+'</div>'}
function mkDraw(){const b=$('#mkbody');if(b)b.innerHTML=mkBody()}
function mkBody(){const t=db.tests.find(x=>x.id==mkT);if(!t)return'';const st=db.students[t.cls]||[];
 if(!st.length)return'<p class="sub">There is no class list for '+esc(t.cls)+' yet. Add it in Class Registers first.</p>';

 else if(t.marks){const v=Object.entries(t.marks),n=v.length;if(n){const a=v.map(x=>x[1]),avg=a.reduce((x,y)=>x+y,0)/n;h+=`<div class="card" style="margin-top:12px"><h3>Saved results</h3><p>${n} of ${st.length} students · average ${(avg).toFixed(1)}/${t.total} (${Math.round(100*avg/t.total)}%) · highest ${Math.max(...a)} · lowest ${Math.min(...a)} · passed (50%+) ${a.filter(x=>x>=t.total/2).length}</p><div class="tbl"><table>${v.sort((x,y)=>y[1]-x[1]).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}/${t.total}</td></tr>`).join('')}</table></div><button class="btn alt" onclick="mkCsv()">Download CSV</button></div>`}}

async function shrink(f){const b=await createImageBitmap(f);const s=Math.min(1,1600/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext('2d').drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.8))}
async function mkRead(){const t=db.tests.find(x=>x.id==mkT),st=db.students[t.cls]||[];
 if(!mkImgs.length){mkMsg=flash('Add at least one photo first.','err');return mkDraw()}
 mkMsg=flash('Reading the photos. This can take a minute.');mkDraw();
 try{const sample=window.claude&&await claude.use('sample');if(!sample)throw{code:'none'};const lim=await sample.limits();if(!lim.images)throw{code:'noimg'};
  const blobs=await Promise.all(mkImgs.map(shrink));
  const p='You read marked test scripts or mark sheets from photos for a secondary school teacher in Zimbabwe.\nClass list: '+JSON.stringify(st)+'\nThe test total is '+t.total+' marks.\nFor each student whose total mark you can see, give the mark. Match each name to the class list spelling exactly. If a name does not match anyone in the list, use the name "UNMATCHED: " followed by what you read. Never guess: if a mark is unclear, set mark to null and explain in note. Note any mark above '+t.total+'. Return only a JSON array like [{"name":"","mark":0,"note":""}].';
  const r=await sample.json(p,{images:blobs,cache:false});const arr=Array.isArray(r)?r:[];
  mkRows=st.map(n=>{const e=arr.find(x=>x&&x.name==n);return{n,m:e&&typeof e.mark=='number'?e.mark:'',note:e?(e.note||''):'Not found in the photos'}});
  const un=arr.filter(x=>x&&String(x.name).startsWith('UNMATCHED'));
  mkMsg=flash('Done. Check each mark below.'+(un.length?' Names not matched to your class list: '+un.map(x=>x.name.replace('UNMATCHED: ','')+' ('+x.mark+')').join(', ')+'.':''),'okm');
 }catch(e){const c=e&&e.code;mkMsg=flash(c=='none'||c=='noimg'?'Photo reading works only on the published page with Claude access allowed. You can enter the marks by hand instead.':c=='not_granted'?'Reading photos needs your permission. Tap Read marks again and allow it.':c=='rate_limited'?'Too many requests. Wait a minute and try again.':'Could not read the photos: '+((e&&e.message)||'unknown error')+'. You can enter the marks by hand.','err')}
 mkDraw()}
async function mkSave(){const t=db.tests.find(x=>x.id==mkT);if(mkRows.some(r=>r.m!==''&&(r.m>t.total||r.m<0)))return alert('Some marks are above the total or below 0. Fix them first.');
 const miss=mkRows.filter(r=>r.m==='').length;if(miss&&!await dlg(miss+' student(s) have no mark. Save anyway?','c'))return;
 t.marks={};mkRows.forEach(r=>{if(r.m!=='')t.marks[r.n]=r.m});log('save marks',t.id);save();mkRows=null;mkImgs=[];mkMsg=flash('Marks saved.','okm');mkDraw()}

 for(let i=s.rows.length-1;i>=w;i--){for(const k of['topic','sub','obj','content','methods','act','res','assess'])s.rows[i][k]=s.rows[i-1][k]}

async function ask(){const q=$('#aq').value.trim();if(!q)return;let sample=null;try{sample=window.claude?await claude.use('sample'):null}catch(e){}
 if(!sample)return askOld();
 const hist=chat.filter(m=>m.t!='\u2026').slice(-8).map(m=>({role:m.r=='me'?'user':'assistant',content:m.t}));while(hist.length&&hist[0].role!='user')hist.shift();
 chat.push({r:'me',t:q},{r:'bot',t:'\u2026'});$('#aq').value='';chatDraw();
 try{const r=await sample([...hist,{role:'user',content:sysP()+'\n\nTeacher says: '+q}],{tools:aiTools(),cache:false,onText:({text})=>{chat[chat.length-1].t=text||'\u2026';chatDraw()}});chat[chat.length-1].t=r.text||'Done.'}
 catch(e){const c=e&&e.code;chat[chat.length-1].t=c=='not_granted'?'I need your permission first. Send your question again and tap allow.':c=='rate_limited'?'Too many requests. Wait a minute and try again.':'Sorry, I could not answer: '+((e&&e.message)||'error')}
 draw()}
function askOld(){const q=$('#aq').value.trim();if(!q)return;chat.push({r:'me',t:q});const l=q.toLowerCase();let a;
 const cls=myClasses().find(c=>l.includes(c.toLowerCase()));
 if(/not completed|incomplete|outstanding|missing/.test(l)){const p=pendingRegs();a=p.length?'Registers not completed today ('+dayName()+'):\n'+p.map(x=>`• ${x.cls} – ${x.subj} (${x.start})`).join('\n'):`No outstanding registers found for today${myTT().some(x=>x.day==dayName())?'.':' – and you have no lessons on the timetable for today.'}`}
 else if(/attendance|absent|summar/.test(l)&&cls){const {rs,by}=stats(cls);if(!rs.length)a='There are no saved registers for '+cls+' yet.';else{const tp=Object.values(by).reduce((x,v)=>x+v.p,0),tt=Object.values(by).reduce((x,v)=>x+v.t,0),rep=Object.entries(by).filter(([n,v])=>v.a>=2).map(([n,v])=>`${n} (${v.a} absences)`);a=`${cls}: ${rs.length} saved registers, overall attendance ${Math.round(100*tp/tt)}%.`+(rep.length?'\nRepeated absences: '+rep.join(', ')+'.':'\nNo repeated absences.')}}
 else if(/timetable|lesson|today/.test(l)){const t=myTT().filter(x=>x.day==dayName());a=t.length?'Today:\n'+t.map(x=>`• ${x.start}–${x.end} ${x.subj}, ${x.cls}${x.room?', '+x.room:''}`).join('\n'):'You have no lessons recorded for today.'}
 else if(/parent|guardian|message/.test(l)){a='Draft for your review (nothing is sent):\n\nDear Parent/Guardian,\nI am writing from Masotsha High School about [student name], who has been absent from '+(cls||'[class]')+' on [dates]. Please contact the school so we can support [him/her]. \n\nThank you,\n'+me.name}
 else if(/mark|result|project|average|score/.test(l)){const A=allA();a=A.length?A.map(x=>'\u2022 '+x.type+' '+x.title+' ('+x.cls+' '+x.subject+'): '+sumTxt(x)).join('\n'):'No marks saved yet. Use Marks and Projects to record them.'}
 else if(/syllabus|lesson|topic/.test(l)){const sb=[...new Set(mySubs().map(x=>x.subj))],ws=l.split(/\W+/).filter(w=>w.length>3&&!['which','topics','topic','teach','lesson','lessons','syllabus','should','about','form','show','what'].includes(w)),out=[];db.syl.filter(e=>me.role=='admin'||sb.includes(e.subj)).forEach(e=>e.topics.split('\n').forEach(t=>{if(ws.some(w=>t.toLowerCase().includes(w)))out.push('\u2022 '+t.trim()+' ('+e.lvl+'-Level '+e.subj+', '+e.form+')')}));a=out.length?out.slice(0,12).join('\n'):'I found no matching topics. Open the Syllabus page to search, or ask the administrator to add the topics.'}
 else if(/test/.test(l))a='Open In-Class Tests, enter what you taught and your total marks. I will build an editable draft for you to approve.';
 else if(/scheme/.test(l))a='Open Schemes of Work to spread your topics across the term. If you miss a lesson, use "Missed lesson" and confirm the change.';
 else a='I can help with: incomplete registers, attendance summaries for a class, your timetable, parent message drafts, and guidance on tests and schemes. I will not invent records, and I need your confirmation before any change.';
 chat.push({r:'bot',t:a});draw()}
/* MARKS AND PROJECTS */
let ma=null,maRows=null;
const sumTxt=a=>{const v=Object.values(a.marks);if(!v.length)return'no marks';const avg=v.reduce((x,y)=>x+y,0)/v.length;return v.length+' marks, average '+avg.toFixed(1)+'/'+a.total+' ('+Math.round(100*avg/a.total)+'%), highest '+Math.max(...v)+', lowest '+Math.min(...v)};
function marks(){const opts=mySubs().flatMap(s=>s.classes.map(c=>({s:s.subj,l:s.lvl,c}))),mine=db.assess.filter(a=>a.uid==me.id);
 return`<h2>Marks and Projects</h2><div class="card noprint"><h3>New assessment</h3>${opts.length?`<div class="grid"><div><label>Subject and class</label><select id="as">${opts.map(o=>`<option value="${esc(o.l+'|'+o.s+'|'+o.c)}">${o.l}-Level ${esc(o.s)} \u2013 ${esc(o.c)}</option>`).join('')}</select></div><div><label>Type</label><select id="at">${['Project','Assignment','Practical','Exam','Other'].map(t=>`<option>${t}</option>`).join('')}</select></div><div><label>Title</label><input id="ati" placeholder="e.g. Term 3 project"></div><div><label>Total marks</label><input id="atm" type="number" value="50"></div></div><button class="btn" onclick="newAs()">Start entering marks</button><p class="sub">You can also ask the AI Assistant to record marks for you. Test marks are entered on the In-Class Tests page.</p>`:'<p class="sub">You have no subjects or classes registered.</p>'}</div>${maRows?asEntry():''}
 <div class="card"><h3>Saved assessments</h3>${mine.map(a=>`<div style="margin:8px 0"><b>${esc(a.type)}: ${esc(a.title)}</b> \u00b7 ${a.lvl}-Level ${esc(a.subj)} ${esc(a.cls)}<br><span class="sub">${sumTxt(a)}</span><br><a href="#" onclick="openAs('${a.id}');return false">Open</a> \u00b7 <a href="#" onclick="csvAs('${a.id}');return false">Download CSV</a></div>`).join('')||'<p class="sub">None yet.</p>'}</div>`}
function newAs(){const [l,s,c]=$('#as').value.split('|'),t=$('#ati').value.trim(),tot=+$('#atm').value,st=db.students[c]||[];
 if(!t||!(tot>0))return alert('Enter a title and the total marks.');if(!st.length)return alert('There is no class list for '+c+'. Add it in Class Registers first.');
 ma={id:uid(),uid:me.id,lvl:l,subj:s,cls:c,type:$('#at').value,title:t,total:tot,marks:{}};maRows=st.map(n=>({n,m:''}));draw()}
function openAs(id){ma=db.assess.find(a=>a.id==id);maRows=(db.students[ma.cls]||[]).map(n=>({n,m:ma.marks[n]??''}));draw();window.scrollTo(0,0)}
function asEntry(){return`<div class="card"><h3>${esc(ma.type)}: ${esc(ma.title)} \u00b7 ${esc(ma.cls)} ${esc(ma.subj)} \u00b7 out of ${ma.total}</h3><div class="tbl"><table>${maRows.map((r,i)=>`<tr><td>${esc(r.n)}</td><td><input type="number" step="0.5" min="0" style="width:90px" value="${r.m}" onchange="maRows[${i}].m=this.value===''?'':+this.value"></td></tr>`).join('')}</table></div><button class="btn" onclick="asSave()">Save marks</button><button class="btn alt" onclick="ma=null;maRows=null;draw()">Cancel</button></div>`}
async function asSave(){if(maRows.some(r=>r.m!==''&&(r.m>ma.total||r.m<0)))return alert('Some marks are above the total or below 0. Fix them first.');
 const miss=maRows.filter(r=>r.m==='').length;if(miss&&!await dlg(miss+' student(s) have no mark. Save anyway?','c'))return;
 ma.marks={};maRows.forEach(r=>{if(r.m!=='')ma.marks[r.n]=r.m});if(!db.assess.some(a=>a.id==ma.id))db.assess.push(ma);log('save marks',ma.id);save();ma=null;maRows=null;draw()}
function csvAs(id){const a=db.assess.find(x=>x.id==id);dl('Student,Mark,Total\n'+Object.entries(a.marks).map(x=>'"'+x[0]+'",'+x[1]+','+a.total).join('\n'),'marks.csv')}
/* SYLLABUS TOPICS */
function syl(){const adm=me.role=='admin',sb=[...new Set(mySubs().map(x=>x.subj))],q=(window.sq||'').toLowerCase().trim();
 const L=db.syl.filter(e=>adm||sb.includes(e.subj)).map(e=>({e,lines:e.topics.split('\n').map(x=>x.trim()).filter(x=>x&&(!q||x.toLowerCase().includes(q)||(e.subj+' '+e.form).toLowerCase().includes(q)))})).filter(x=>x.lines.length);
 const subs=[...new Set([...db.cfg.subjects.O,...db.cfg.subjects.A])];
 return`<h2>Syllabus Topics</h2><div class="card noprint"><input id="sq" placeholder="Search topics, e.g. quadratic" value="${esc(window.sq||'')}"><button class="btn" onclick="window.sq=$('#sq').value;draw()">Search</button><p class="sub">${adm?'You see every subject.':'Showing only your subjects: '+esc(sb.join(', ')||'none')+'.'} Topics are added by the administrator from the official ZIMSEC syllabus.</p></div>
 ${L.map(x=>`<div class="card"><b>${x.e.lvl}-Level ${esc(x.e.subj)} \u00b7 ${esc(x.e.form)}</b><div class="bot">${esc(x.lines.join('\n'))}</div>${adm?`<button class="btn bad" onclick="delSyl('${x.e.id}')">Delete</button>`:''}</div>`).join('')||'<div class="card sub">No topics found. The administrator can add them on this page.</div>'}
 ${adm?`<div class="card"><h3>Add syllabus topics</h3><div class="grid"><div><label>Subject</label><select id="sy_s">${subs.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div><div><label>Level</label><select id="sy_l"><option value="O">O-Level</option><option value="A">A-Level</option></select></div><div><label>Form or class</label><select id="sy_f">${[...db.cfg.classes.O,...db.cfg.classes.A].map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div><label>Topics (one per line)</label><textarea id="sy_t"></textarea><button class="btn" onclick="addSyl()">Add topics</button></div>`:''}`}
function addSyl(){const t=$('#sy_t').value.trim();if(!t)return alert('Type or paste the topics first.');db.syl.push({id:uid(),subj:$('#sy_s').value,lvl:$('#sy_l').value,form:$('#sy_f').value,topics:t});log('add syllabus topics',$('#sy_s').value);save();draw()}
async function delSyl(id){if(await dlg('Delete these topics?','c')){db.syl=db.syl.filter(e=>e.id!=id);save();draw()}}
function restoreBk(f){if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.users||!d.cfg)throw 0;if(await dlg('Replace all data on this device with the backup? This cannot be undone.','c')){db=d;db.assess=db.assess||[];db.syl=db.syl||[];save();me=null;view='login';notice=flash('Backup restored. Log in again.','okm');draw()}}catch(e){alert('That file is not a valid backup.')}};r.readAsText(f)}
/* ADMIN */
function admin(){const c=db.cfg,pend=db.users.filter(u=>u.status=='pending'),rs=db.users.filter(u=>u.resetPw);
 const list=(k,L)=>`<div class="chk">${c[k][L].map((s,i)=>`<span class="tag">${esc(s)} <a href="#" onclick="rmCfg('${k}','${L}',${i});return false">✕</a></span>`).join('')}</div><input id="n_${k}${L}" placeholder="Add new"><button class="btn alt" onclick="addCfg('${k}','${L}')">Add</button>`;
 return`<h2>Administration</h2><div class="card"><h3>Pending teachers</h3>${pend.map(u=>`<div>${esc(u.name)} · ${esc(u.dept)} · ${u.subs.map(s=>s.lvl+' '+esc(s.subj)).join(', ')} <button class="btn" onclick="appr('${u.id}',1)">Approve</button><button class="btn bad" onclick="appr('${u.id}',0)">Reject</button></div>`).join('')||'<p class="sub">None waiting.</p>'}</div>
${rs.length?`<div class="card"><h3>Password resets</h3>${rs.map(u=>`<div>${esc(u.username)} <button class="btn" onclick="rst('${u.id}')">Approve reset</button></div>`).join('')}</div>`:''}
<div class="card"><h3>Departments</h3><div class="chk">${c.depts.map((s,i)=>`<span class="tag">${esc(s)} <a href="#" onclick="rmD(${i});return false">✕</a></span>`).join('')}</div><input id="nd" placeholder="Add department"><button class="btn alt" onclick="addD()">Add</button></div>
<div class="card"><h3>O-Level subjects</h3>${list('subjects','O')}</div><div class="card"><h3>A-Level subjects</h3>${list('subjects','A')}</div>
<div class="card"><h3>O-Level classes</h3>${list('classes','O')}</div><div class="card"><h3>A-Level classes</h3>${list('classes','A')}</div>
<div class="card"><h3>Timetable error reports</h3>${db.reports.map(r=>`<div>${r.t} · ${esc((db.users.find(u=>u.id==r.uid)||{}).name)}: ${esc(r.msg)}</div>`).join('')||'<p class="sub">None.</p>'}</div>
<div class="card"><h3>Audit log (last 15)</h3><div class="tbl"><table>${db.audit.slice(-15).reverse().map(a=>`<tr><td>${a.t.slice(0,16)}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td></tr>`).join('')}</table></div><button class="btn alt" onclick="dl(JSON.stringify(db),'masotsha-backup.json')">Download backup</button><label>Restore from a backup file</label><input type="file" accept=".json" onchange="restoreBk(this.files[0])"></div>`}
function appr(id,ok){const u=db.users.find(u=>u.id==id);u.status=ok?'approved':'rejected';log(ok?'approve teacher':'reject teacher',u.username);save();draw()}
async function rst(id){const u=db.users.find(u=>u.id==id);u.pw=u.resetPw;delete u.resetPw;log('approve reset',u.username);save();draw()}
function addD(){const v=$('#nd').value.trim();if(v){db.cfg.depts.push(v);save();draw()}}
function rmD(i){db.cfg.depts.splice(i,1);save();draw()}
async function addCfg(k,L){const v=$('#n_'+k+L).value.trim();if(v){if(k=='subjects'){const d=await dlg('Department for "'+v+'"? Options: '+db.cfg.depts.join(', '),'p');if(d)db.cfg.sdept[v]=d.trim()}db.cfg[k][L].push(v);log('config add',v);save();draw()}}
async function rmCfg(k,L,i){if(await dlg('Remove "'+db.cfg[k][L][i]+'"? Existing teacher records keep it.','c')){db.cfg[k][L].splice(i,1);save();draw()}}
(async()=>{await ensureAdmin();const s=SS.get('mhs_u');me=s?db.users.find(u=>u.id==s&&u.status=='approved')||null:null;view=me?'dash':'login';draw()})();
</script></body></html>
